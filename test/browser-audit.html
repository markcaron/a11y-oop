<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>a11y-oop automated audit runner</title><style>body{font:16px/1.5 system-ui;margin:24px;background:white;color:#222}button,input,select{font:inherit;padding:10px}iframe{display:block;border:1px solid #666;width:1280px;height:900px}pre{white-space:pre-wrap}label{display:inline-block;margin:12px}textarea{width:100%;height:250px}button:focus-visible{outline:3px solid #005a96;outline-offset:3px}</style><h1>Rendered accessibility audit</h1><p>This local development runner scans built pages in the browser. It never changes checklist results or notes. Reports are written to audits/ locally.</p><label>Color scheme<select id="scheme"><option>light</option><option>dark</option></select></label><label>Viewport width<select id="width"><option>1280</option><option>320</option></select></label><button id="matrix">Scan full matrix</button><button id="run">Scan all built pages</button><button id="states">Scan checklist states</button><label>Preview page<select id="preview-page"><option value="/">Home</option><option value="/checklist/">Checklist</option><option value="/guidelines/design/">Design guidance</option></select></label><button id="preview">Preview selected page</button><p id="status" role="status">Ready.</p><details><summary>Results</summary><pre id="results"></pre></details><iframe id="target" title="Page being audited"></iframe><script type="module">
const status=document.getElementById('status'), results=document.getElementById('results'), frame=document.getElementById('target');
const tags=['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa','best-practice'];
async function load(path){await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src=path});const w=frame.contentWindow;if(w.document.querySelector('a11y-checklist')){await Promise.race([w.customElements.whenDefined('a11y-checklist'),new Promise((_,reject)=>setTimeout(()=>reject(Error('Checklist module did not load')),10000))]);if(w.document.querySelector('[data-filters] fieldset').disabled)throw Error('Checklist did not enhance');}await new Promise(resolve=>{const s=w.document.createElement('script');s.src='/__audit/axe.min.js';s.onload=resolve;w.document.head.append(s)});w.document.documentElement.style.colorScheme=document.getElementById('scheme').value;frame.style.width=document.getElementById('width').value+'px';await w.document.fonts.ready;await Promise.all(w.document.getAnimations().filter(a=>a.effect?.getTiming().iterations!==Infinity).map(a=>a.finished.catch(()=>{})));await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));return w;}
async function scan(w,path,state){const result=await w.axe.run(w.document,{runOnly:{type:'tag',values:tags}});return {path,state,viewport:{width:w.innerWidth,height:w.innerHeight},horizontalOverflow:w.document.documentElement.scrollWidth>w.innerWidth,colorScheme:document.getElementById('scheme').value,enhanced:!w.document.querySelector('a11y-checklist')||!w.document.querySelector('[data-filters] fieldset').disabled,axeVersion:result.testEngine.version,url:result.url,violations:result.violations,incomplete:result.incomplete,passes:result.passes.map(r=>r.id),inapplicable:result.inapplicable.map(r=>r.id)};}
async function save(report){results.textContent=JSON.stringify(report,null,2);const response=await fetch('/__audit/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});if(!response.ok)throw Error('Could not save audit report');const violations=report.scans.reduce((n,s)=>n+s.violations.length,0);status.textContent='Finished '+report.scans.length+' scans; '+violations+' rule violations. Saved '+(await response.json()).path;}
async function run(mode){document.querySelectorAll('button,select').forEach(b=>b.disabled=true);status.textContent='Audit running…';const report={schemaVersion:1,startedAt:new Date().toISOString(),mode,tags,userAgent:navigator.userAgent,scans:[]};try{if(mode==='pages'){const paths=await (await fetch('/__audit/pages')).json();for(const path of paths){status.textContent='Scanning '+path;const w=await load(path);report.scans.push(await scan(w,path,'default'));}}else{const path='/checklist/?topic=Tables%20and%20structured%20data';let w=await load(path);for(const d of w.document.querySelectorAll('article:not([hidden]) details'))d.open=true;report.scans.push(await scan(w,path,'filtered; visible details expanded'));w.document.querySelector('[data-reset]').click();report.scans.push(await scan(w,path,'reset dialog open'));w.document.querySelector('[data-reset-dialog]').close();w.document.querySelector('[data-import-summary]').textContent='Replace progress with a validated test import?';w.document.querySelector('[data-import-dialog]').showModal();report.scans.push(await scan(w,path,'import dialog open'));}report.completedAt=new Date().toISOString();await save(report);}catch(error){status.textContent='Audit failed: '+error.message;results.textContent=JSON.stringify(report,null,2);}finally{document.querySelectorAll('button,select').forEach(b=>b.disabled=false);}}
document.getElementById('preview').addEventListener('click',async()=>{try{await load(document.getElementById('preview-page').value);status.textContent='Preview only; no report saved.';}catch(error){status.textContent=error.message;}});
document.getElementById('matrix').addEventListener('click',async()=>{for(const width of ['1280','320'])for(const scheme of ['light','dark']){document.getElementById('width').value=width;document.getElementById('scheme').value=scheme;await run('pages');await run('states');}});document.getElementById('run').addEventListener('click',()=>run('pages'));document.getElementById('states').addEventListener('click',()=>run('states'));
</script></html>
